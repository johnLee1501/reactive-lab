server:
  port: 8080
  tomcat:
    threads:
      max: 200       # default Tomcat thread pool
      min-spare: 10

spring:
  application:
    name: mvc-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/catalog_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
